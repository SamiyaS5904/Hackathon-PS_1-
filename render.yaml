# Render blueprint: the backend API and the assistant, as two FREE web services (no card needed).
# Render dashboard -> New -> Blueprint -> pick this repository. Values marked `sync: false`
# are typed in the dashboard (never committed). Full steps: docs/DEPLOY.md.
#
# Free services sleep after 15 minutes without visits; a free ping every 10 minutes (cron-job.org) keeps them awake.
# Both services must run ONE process: college data lives in memory and is saved in the
# background, so several workers would not see each other's changes.

services:
  - type: web
    name: timetabl-backend
    runtime: python
    rootDir: backend
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SOLVER_WORKERS # the free machine has a small share of one CPU
        value: "1"
      - key: DEMO_PLATFORM_OWNER
        value: "1"
      - key: DATABASE_URL # Supabase -> Connect -> Session pooler URI (IPv4), with your database password
        sync: false
      - key: APP_SECRET # the same value as in backend/.env, so logins work everywhere
        sync: false
      - key: CORS_ORIGINS # your Vercel URL, e.g. https://timetabl-ai.vercel.app
        sync: false
      - key: FRONTEND_URL # your Vercel URL (used in invite links)
        sync: false

  - type: web
    name: timetabl-assistant
    runtime: python
    rootDir: chatbot
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY # optional: natural voice
        sync: false
      - key: BACKEND_URL # the backend's Render URL, e.g. https://timetabl-backend.onrender.com
        sync: false
      - key: CORS_ORIGINS # your Vercel URL
        sync: false
